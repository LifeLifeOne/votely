# Full stack: docker compose up --build  ->  http://localhost:8080
# Database only (local development): docker compose up -d db
name: votely

x-hardening: &hardening
  # Containers cannot gain privileges, have no Linux capabilities and a read-only filesystem.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

x-backend-env: &backend-env
  VOTELY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  VOTELY_JWT_SECRET: ${VOTELY_JWT_SECRET:?set it in .env}
  VOTELY_COOKIE_SECURE: ${VOTELY_COOKIE_SECURE:-true}
  VOTELY_LOG_LEVEL: ${VOTELY_LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      # Bound to localhost only: the database is never exposed on the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies database migrations, then exits. The API waits for it.
  migrate:
    image: votely-backend:local
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    <<: *hardening

  backend:
    image: votely-backend:local
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    tmpfs:
      - /tmp
    <<: *hardening
    # No published port: the API is only reachable through the frontend proxy.

  frontend:
    image: votely-frontend:local
    build: ./frontend
    environment:
      VOTELY_API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:${VOTELY_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      # nginx needs to write its pid, temp files and the rendered config.
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    <<: *hardening

volumes:
  db-data:
