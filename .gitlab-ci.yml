# Pipeline entry point: global settings only. Jobs are grouped by component in .gitlab/ci/.

workflow:
  rules:
    # One pipeline per change: merge request pipelines, the default branch and tags.
    # Branch pipelines are skipped while a merge request is open, to avoid duplicates.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    # A new push cancels the outdated pipeline of the same branch.
    on_new_commit: interruptible

# Columns of the pipeline graph (.pre always runs first: secrets scan).
stages:
  - analyze # source code, without running it: lint, types, security
  - test # unit and integration tests
  - build # production images
  - verify # the images just built: end-to-end tests, vulnerability scan

default:
  interruptible: true
  # Retry only infrastructure failures, never a failing test or lint.
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure, api_failure]

include:
  - local: .gitlab/ci/templates.gitlab-ci.yml
  - local: .gitlab/ci/backend.gitlab-ci.yml
  - local: .gitlab/ci/frontend.gitlab-ci.yml
  - local: .gitlab/ci/e2e.gitlab-ci.yml
