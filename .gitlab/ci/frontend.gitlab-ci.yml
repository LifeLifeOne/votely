# Frontend (React + Vite): node, dependencies installed from frontend/package-lock.json.

.frontend:
  image: node:24-alpine
  cache:
    key:
      prefix: frontend
      files: [frontend/package-lock.json]
    paths: [.npm]
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline --no-audit --no-fund
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/frontend.gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend:lint-oxlint:
  extends: .frontend
  stage: analyze
  script:
    - npm run lint

frontend:format-prettier:
  extends: .frontend
  stage: analyze
  script:
    - npm run format:check

frontend:typecheck-tsc:
  extends: .frontend
  stage: analyze
  script:
    - npm run typecheck

frontend:test-vitest:
  extends: .frontend
  stage: test
  needs: [frontend:lint-oxlint, frontend:typecheck-tsc]
  script:
    - >
      npx vitest run --coverage
      --reporter=default --reporter=junit --outputFile.junit=junit.xml
      --coverage.reporter=text-summary --coverage.reporter=cobertura
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

frontend:build-image:
  extends: .docker-build
  stage: build
  variables:
    COMPONENT: frontend
  # Never publish an image whose tests failed. Optional: on a merge request that only touches
  # the other component, the tests are skipped but the image is still rebuilt for e2e.
  needs:
    - job: frontend:test-vitest
      optional: true

frontend:sign-image:
  extends: .sign-image
  variables:
    COMPONENT: frontend
  # Only once the image passed every check of the verify stage.
  needs:
    - frontend:build-image # FRONTEND_IMAGE digest
    - job: e2e:test-playwright
      artifacts: false
    - job: security:scan-image-trivy # sbom-frontend.cdx.json
      parallel:
        matrix:
          - COMPONENT: frontend

frontend:publish-image:
  extends: .publish-image
  variables:
    COMPONENT: frontend
  # Deployment tags only on a signed image.
  needs:
    - frontend:build-image # FRONTEND_IMAGE digest
    - job: frontend:sign-image
      artifacts: false

frontend:promote-image:
  extends: .promote-image
  variables:
    COMPONENT: frontend
