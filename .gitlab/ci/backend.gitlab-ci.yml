# Backend (FastAPI): python + uv, dependencies resolved from backend/uv.lock.

.backend:
  image: ghcr.io/astral-sh/uv:0.12-python3.12-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    UV_LINK_MODE: copy
    UV_FROZEN: "1" # never update the lockfile in CI
  cache:
    key:
      prefix: backend
      files: [backend/uv.lock]
    paths: [.cache/uv]
  before_script:
    - cd backend
  rules:
    # Merge requests: only when the backend or its pipeline changed. Default branch: always.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/backend.gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend:lint-ruff:
  extends: .backend
  stage: analyze
  script:
    - uv run ruff check .
    - uv run ruff format --check .

backend:test-pytest:
  extends: .backend
  stage: test
  # Start as soon as the backend is linted, without waiting for the other components.
  needs: [backend:lint-ruff]
  services:
    # Real PostgreSQL: integration tests and migrations run against the same engine as production.
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # Throwaway credentials for the CI service container only.
    POSTGRES_USER: votely
    POSTGRES_PASSWORD: votely
    POSTGRES_DB: votely
    VOTELY_DATABASE_URL: postgresql+psycopg://votely:votely@postgres:5432/votely
  script:
    - uv run pytest --junitxml=junit.xml --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

backend:build-image:
  extends: .docker-build
  stage: build
  variables:
    COMPONENT: backend
  # Never publish an image whose tests failed. Optional: on a merge request that only touches
  # the other component, the tests are skipped but the image is still rebuilt for e2e.
  needs:
    - job: backend:test-pytest
      optional: true

backend:publish-image:
  extends: .publish-image
  variables:
    COMPONENT: backend
  # Only once the image passed every check of the verify stage.
  needs:
    - backend:build-image # BACKEND_IMAGE digest
    - job: e2e:test-playwright
      artifacts: false
    - job: security:scan-image-trivy
      parallel:
        matrix:
          - COMPONENT: backend
      artifacts: false

backend:promote-image:
  extends: .promote-image
  variables:
    COMPONENT: backend
