# Building blocks shared by several components, reused with `extends` and `!reference`.

# Paths that affect the application images and the end-to-end tests. Build and e2e jobs run
# when any of them changes, so the two images under test always come from the same pipeline.
.rules:app:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - frontend/**/*
        - e2e/**/*
        - compose*.yaml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Merge requests and the default branch. Release tag pipelines run no checks: they promote
# images that were already verified on the default branch.
.rules:checks:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Docker-in-Docker client, logged in to the project's container registry with the job token.
.docker:
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Build a component image (COMPONENT=backend|frontend) with BuildKit and push it to the
# project's container registry, tagged with the full commit SHA (immutable, traceable).
.docker-build:
  extends: .docker
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$COMPONENT
  before_script:
    - !reference [.docker, before_script]
    # The docker-container driver can export the layer cache to the registry. With the TLS
    # connection to the dind service, buildx needs a named context to create its builder.
    - docker context create ci
    - docker buildx create --use --driver docker-container ci
  script:
    # Only the default branch writes the shared layer cache; merge requests read it.
    - |
      cache_to=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        cache_to="--cache-to type=registry,ref=$IMAGE:buildcache,mode=max"
      fi
    - >
      docker buildx build "$COMPONENT"
      --pull
      --cache-from "type=registry,ref=$IMAGE:buildcache"
      $cache_to
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --tag "$IMAGE:$CI_COMMIT_SHA"
      --metadata-file metadata.json
      --push
    # Expose the pushed digest to later jobs (e2e, scans, signing) as a dotenv variable,
    # e.g. BACKEND_IMAGE=registry.gitlab.com/.../backend@sha256:...
    - |
      digest=$(grep -o '"containerimage.digest": *"[^"]*"' metadata.json | grep -o 'sha256:[0-9a-f]*')
      echo "$(echo "$COMPONENT" | tr a-z A-Z)_IMAGE=$IMAGE@$digest" | tee build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - !reference [.rules:app, rules]

# Registry client that adds tags to an image in place (no pull, no rebuild), logged in to the
# project's container registry with the job token.
.crane:
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.22.1
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none # only the registry is needed
    IMAGE: $CI_REGISTRY_IMAGE/$COMPONENT
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

# Default branch: tag the image verified by this pipeline (digest from the build job).
#   main-<short sha>  this commit's verified image, the one a release promotes
#   main              the latest verified image
.publish-image:
  extends: .crane
  script:
    - VERIFIED=$(printenv "$(echo "$COMPONENT" | tr a-z A-Z)_IMAGE")
    - crane tag "$VERIFIED" "main-$CI_COMMIT_SHORT_SHA"
    - crane tag "$VERIFIED" main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Release tag vX.Y.Z: nothing is rebuilt. The image verified on the default branch for this
# commit gets the version tag X.Y.Z, so production runs exactly what was tested.
.promote-image:
  extends: .crane
  needs: []
  script:
    - |
      if ! crane digest "$IMAGE:main-$CI_COMMIT_SHORT_SHA" > /dev/null; then
        echo "No verified image for $CI_COMMIT_SHORT_SHA: tag a commit of $CI_DEFAULT_BRANCH once its pipeline has passed."
        exit 1
      fi
    - crane tag "$IMAGE:main-$CI_COMMIT_SHORT_SHA" "${CI_COMMIT_TAG#v}"
  rules:
    - if: $CI_COMMIT_TAG
