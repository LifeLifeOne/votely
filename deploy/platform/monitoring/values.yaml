# kube-prometheus-stack on the single k3s node. Nothing is exposed on the internet: Grafana is
# reached through the Systems Manager tunnel (deploy/aws/grafana-ui.sh).

# k3s runs the control plane inside one process: these components expose no separate metrics
# endpoint, so scraping them would only raise false alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor and PrometheusRule of the cluster, not only the ones labelled
    # with this release: the application's own monitoring lives in its chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # A short history is enough for the showcase and spares the data disk.
    retention: 3d
    retentionSize: 3GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

grafana:
  # The admin credentials come from a SealedSecret: a password generated by the chart would
  # change at every Argo CD render.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards are ConfigMaps labelled grafana_dashboard, loaded from every namespace.
  sidecar:
    dashboards:
      searchNamespace: ALL
  # Stateless: dashboards come from Git, nothing is created by hand.
  persistence:
    enabled: false
  # Loading the dashboards of the chart takes about 225 MiB: 256 MiB got Grafana OOMKilled.
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
