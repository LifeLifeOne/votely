# Local Kubernetes cluster: a single node running in Docker, same Kubernetes minor version as
# the k3s server. Traefik listens on node port 30080, published on http://localhost (port 80).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: votely
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1 # never exposed on the local network
