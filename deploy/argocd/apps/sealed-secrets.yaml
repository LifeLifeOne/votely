# Sealed Secrets controller: decrypts the SealedSecrets committed in Git into ordinary Secrets.
# Only this controller holds the private key; anyone can encrypt with the public certificate.
# Deployed early (wave -2): the environments need their Secrets before they start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0 # controller v0.40.0
    helm:
      valuesObject:
        # The name kubeseal looks for by default.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
